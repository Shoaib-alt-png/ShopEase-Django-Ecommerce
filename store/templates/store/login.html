
{% extends 'store/base.html' %}

{% block content %}
<div class="checkout-container">
    <h1>Customer Login</h1>

    <form method="POST">
        {% csrf_token %}

        {{ form.as_p }}

        <button class="btn" type="submit">
            Login
        </button>
    </form>

    <p>New customer?
        <a href="{% url 'register' %}">Create account</a>
    </p>
</div>
{% endblock %}
